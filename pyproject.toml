[project]
name = "municipal-audit-assistant"
version = "0.1.0"
description = "Municipal Audit Assistant, Phase 4: digital PDF extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "pydantic==2.10.6",
    "PyYAML==6.0.2",
    "python-dotenv==1.0.1",
    "SQLAlchemy==2.0.36",
    "Faker==33.1.0",
    "scikit-learn==1.5.2",
    "reportlab==4.2.5",
    "pymupdf==1.24.14",
    "openai==1.57.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.6",
]

[tool.setuptools.packages.find]
include = ["core*", "families*", "engine*", "evaluation*", "ingestion*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core", "families", "engine", "evaluation", "ingestion", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["core", "engine", "families", "evaluation", "ingestion"]
