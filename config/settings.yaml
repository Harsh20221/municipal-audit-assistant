database_url: sqlite:///data/municipal_audit.db
enabled_families:
  - property_tax
  - project
logging_level: INFO
generator:
  seed: 42
  error_rate: 0.18
  hard_negative_rate: 0.08
  counts:
    property_tax: 300
    project: 150
layer4:
  # Chosen on generator seed 42. Held-out seed 43 is not used to pick these.
  z_threshold: 5.0
  iqr_k: 1.5
  contamination: 0.05
  min_peer_group: 8
  random_state: 42
risk:
  weights:
    low: 0.10
    medium: 0.30
    high: 0.60
  low_below: 30
  high_above: 60
llm:
  # The ingest script uses the fake client unless --live is passed.
  provider: fake
  model: gpt-4o-mini
  timeout_seconds: 30
  max_retries: 3
  cache_dir: data/cache/llm
  input_cost_per_million: 0.15
  output_cost_per_million: 0.60
